<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>windtrace harness</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1e293b;--graphite:#475569;--slate:#64748b;--mist:#94a3b8;--faint:#e2e8f0;--wash:#f8fafc;
        --paper:#fff;--page:#f1f5f9;--accent:#d97706;--accent-light:#fef3c7;--highlight:#2563eb;--max-marker:#ef4444;
        --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;--k:1px}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--wash);font-family:var(--sans);color:var(--ink);padding:28px}
  .wind{width:860px;background:var(--paper);border:2px solid var(--ink);padding:22px 26px;display:flex;flex-direction:column;gap:20px}
  .wind-readout-row{display:flex;gap:24px;width:100%}
  .wind-data-cell{flex:1;text-align:center;min-width:0}
  .wind-data-cell.dir-cell{flex:1.45}
  .wind-data-cell .lbl{font-family:var(--mono);font-size:14px;letter-spacing:.20em;text-transform:uppercase;color:var(--slate)}
  .wind-data-cell .val{font-family:var(--mono);font-weight:600;font-size:44px;white-space:nowrap}
  .wind-data-cell .val .u{font-size:19px;color:var(--slate);font-weight:400}
  .wind-beaufort{text-align:center;font-weight:600;font-size:19px;color:var(--graphite)}
</style>
<link rel="stylesheet" href="css/windtrace.css">
</head>
<body>
  <section class="wind">
    <div class="wind-dials" id="windDials"></div>
    <div class="wind-readout-row">
      <div class="wind-data-cell"><div class="lbl">Wind speed</div><div class="val"><span id="windSpeed">8.6</span><span class="u"> mph</span></div></div>
      <div class="wind-data-cell dir-cell"><div class="lbl">Direction</div><div class="val"><span id="windDir_text">NNW 329°</span></div></div>
      <div class="wind-data-cell"><div class="lbl">Gust profile</div><div class="val"><span id="windGust">11.0</span><span class="u"> mph</span></div></div>
    </div>
    <div class="wind-beaufort" id="beaufort">Force 3 · Gentle breeze</div>
  </section>
<script>
  window.U = { windUnit: 'mph' };
  // seed a plausible hour so the harness shows a full buffer
  (function () {
    var now = Date.now(), out = [], r = 7749;
    var rnd = function () { r = (r * 1103515245 + 12345) >>> 0; return r / 4294967296; };
    for (var i = 0; i < 60; i++) {
      var t = i / 59;
      var s = Math.max(3, 11.6 + 2.9 * Math.sin(t * Math.PI * 1.6 + .4) + 1.9 * Math.sin(t * Math.PI * 3.9)
              - 3.0 * Math.exp(-Math.pow((t - .30) / .06, 2)) + 3.4 * Math.exp(-Math.pow((t - .80) / .07, 2)) + (rnd() - .5));
      out.push({ t: now - (59 - i) * 60000, s: +s.toFixed(1), g: +(s * 1.28 + 1 + rnd()).toFixed(1),
                 d: Math.round(329 + 13 * Math.sin(t * 6) + (rnd() - .5) * 6) });
    }
    localStorage.setItem('fenland-windtrace-v1', JSON.stringify(out));
  })();
</script>
<script src="src/windtrace.js"></script>
</body>
</html>
